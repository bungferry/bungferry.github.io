---
layout: default
title: Verdoank
---

<h1>{{ page.title }}</h1>

<div id="gallery">
  {% for item in site.data.foto %}
    <img src="{{ item.url }}" loading="lazy" alt="Foto {{ forloop.index }}">
  {% endfor %}
</div>

<p id="loading-text" style="text-align:center; font-family:sans-serif; color:#999; display:none; margin:30px 0;">
  Memuat lebih banyak...
</p>

<style>
  #gallery { text-align: center; }
  .img-container {
    position: relative;
    display: inline-block;
    margin: 4px; /* Margin antar kontainer gambar */
    /* Atur ukuran kontainer agar gambar menempati 100% dari kontainernya */
    width: 30%; /* Sama dengan 3 kolom di desktop */
  }

  /* Aturan media query untuk kontainer gambar */
  @media screen and (max-width: 700px) {
    .img-container {
        width: 45%; /* Sama dengan 2 kolom di mobile */
    }
  }

  .img-container img {
    display: block;
    width: 100%; /* Penting: gambar mengisi kontainer */
    height: auto;
    cursor: pointer;
    /* Efek hover bisa dipindahkan ke sini dari default.html */
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  
  .img-container img:hover {
    transform: scale(1.03);
    opacity: 0.95;
  }


  .download-btn {
    position: absolute;
    bottom: 6px;
    right: 6px; /* **INI PENTING: Mengatur posisi di pojok kanan bawah** */
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0; /* **Penting: Sembunyikan secara default** */
    transition: opacity 0.2s ease;
    /* Pastikan tombol ada di atas gambar */
    z-index: 10;
  }

  .download-btn i { font-size: 16px; }

  /* **Penting: Tampilkan hanya ketika parent (.img-container) memiliki class 'active'** */
  .img-container.active .download-btn {
    opacity: 1;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const gallery = document.getElementById("gallery");
  const fallback = "{{ '/assets/images/error.png' | relative_url }}";
  const loadingText = document.getElementById("loading-text");
  let loading = false;

  // Fallback untuk gambar YAML
  gallery.querySelectorAll("img").forEach(img => {
    img.onerror = () => { img.src = fallback; };
  });

  // Fungsi memuat gambar acak dari Picsum
  function loadRandomPicsum(amount = 15) {
    if (loading) return;
    loading = true;
    loadingText.style.display = "block";

    setTimeout(() => {
      for (let i = 0; i < amount; i++) {
        const randomId = Math.floor(Math.random() * 100000);
        const img = document.createElement("img");
        img.src = `https://picsum.photos/600?random=${randomId}`;
        img.alt = `Foto acak ${randomId}`;
        img.loading = "lazy";
        img.onerror = () => { img.src = fallback; };
        gallery.appendChild(img);
      }

      loading = false;
      loadingText.style.display = "none";
    }, 1000);
  }

  // Load awal
  loadRandomPicsum();

  // Infinite scroll
  window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
      loadRandomPicsum();
    }
  });
});
</script>
