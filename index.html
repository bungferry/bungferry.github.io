---
layout: default
title: Just Another Blog
---

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<h1>{{ site.title }}</h1>

<div id="gallery">
  {% for item in site.data.foto %}
    <div class="img-container">
      <img src="{{ item.url }}" loading="lazy" alt="Foto {{ forloop.index }}">
      <button class="download-btn" title="Unduh gambar">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  {% endfor %}
</div>

<p id="loading-text" style="text-align:center; font-family:sans-serif; color:#999; display:none; margin:30px 0;">
  Memuat lebih banyak...
</p>

<style>
  /* Pastikan tetap inline agar grid asli tidak berubah */
  #gallery {
    text-align: center;
  }

  .img-container {
    position: relative;
    display: inline-block;
    margin: 4px;
  }

  .img-container img {
    display: block;
    max-width: 100%;
    height: auto;
  }

  /* Tombol unduh */
  .download-btn {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  /* Muncul saat gambar disentuh atau di-hover */
  .img-container:hover .download-btn,
  .img-container:active .download-btn {
    opacity: 1;
  }

  .download-btn i {
    font-size: 16px;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const gallery = document.getElementById("gallery");
  const fallback = "{{ '/assets/placeholder.jpg' | relative_url }}";
  const loadingText = document.getElementById("loading-text");
  let loading = false;

  setupDownloadButtons();
  loadRandomPicsum();

  function setupDownloadButtons() {
    document.querySelectorAll("#gallery .img-container img").forEach(img => {
      img.onerror = () => { img.src = fallback; };
      const btn = img.parentElement.querySelector(".download-btn");
      btn.addEventListener("click", e => {
        e.stopPropagation();
        downloadImage(img.src);
      });
    });
  }

  function downloadImage(url) {
    fetch(url)
      .then(res => res.blob())
      .then(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "gambar.jpg";
        document.body.appendChild(a);
        a.click();
        a.remove();
      })
      .catch(err => console.error("Gagal mengunduh:", err));
  }

  function loadRandomPicsum(amount = 15) {
    if (loading) return;
    loading = true;
    loadingText.style.display = "block";

    setTimeout(() => {
      for (let i = 0; i < amount; i++) {
        const randomId = Math.floor(Math.random() * 100000);
        const container = document.createElement("div");
        container.className = "img-container";

        const img = document.createElement("img");
        img.src = `https://picsum.photos/600?random=${randomId}`;
        img.alt = `Foto acak ${randomId}`;
        img.loading = "lazy";
        img.onerror = () => { img.src = fallback; };

        const btn = document.createElement("button");
        btn.className = "download-btn";
        btn.title = "Unduh gambar";
        btn.innerHTML = '<i class="fa-solid fa-download"></i>';
        btn.addEventListener("click", e => {
          e.stopPropagation();
          downloadImage(img.src);
        });

        container.appendChild(img);
        container.appendChild(btn);
        gallery.appendChild(container);
      }

      loading = false;
      loadingText.style.display = "none";
    }, 800);
  }

  // Infinite scroll
  window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
      loadRandomPicsum();
    }
  });
});
</script>
