<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link href="https://fonts.googleapis.com/css?family=Raleway:400,800" rel="stylesheet">
  <style>
    h1 {
        text-transform: uppercase;
        color: black;
        margin: 1.25% 2.5%;
        font-family: Raleway, monospace;
        font-weight: 800;
        border-bottom: 2px solid #f1f1f1;
        padding-bottom: 1.25%;
        width: 30%;
    }
    img {
        width: 30%;
        margin: 1.25% 1.25%;
    }
    p {
        margin: 1.25% 1.25%;
    }
    @media screen and (min-width: 700px) {
        img:nth-of-type(3n+1) { margin-left: 2.5%; }
    }
    @media screen and (max-width: 700px) {
        img:nth-of-type(2n+1) { margin-left: 3.3%; }
        img { width: 45%; margin: 1.65% 1.65%; }
        h1 { width: 45%; margin-left: 3.3%; }
    }
  </style>
</head>
<body>

  {{ content }}

</body>
</html>
