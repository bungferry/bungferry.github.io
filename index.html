---
layout: default
---

<h1>{{ site.title }}</h1>
<p>{{ site.description }}</p>

<div class="gallery">
  {% assign images = site.static_files | where_exp: "file", "file.path contains 'assets/images/'" %}
  {% for image in images %}
    <div class="photo">
      <img src="{{ image.path | relative_url }}" alt="Foto {{ forloop.index }}">
    </div>
  {% endfor %}
</div>

<style>
  body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
    margin: 0;
  }

  h1 {
    margin-top: 20px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    padding: 20px;
  }

  .photo img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    transition: 0.3s;
  }

  .photo img:hover {
    transform: scale(1.05);
  }
</style>
