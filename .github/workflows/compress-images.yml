name: 🖼️ Optimize Images

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Optimize images
        uses: stefanzweifel/image-optim-action@v3
        with:
          quality: 85
          commit_message: "🗜️ Auto-compressed images"
